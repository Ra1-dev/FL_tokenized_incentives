[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fltoken"
version = "0.1.0"
description = "Reproducible token incentives for federated learning"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.5.5",
  "torch==2.15.0",
  "torchvision==0.29.2",
  "flwr==1.43.0",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
