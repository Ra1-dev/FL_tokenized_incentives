[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../third_party"]
remappings = ["@openzeppelin/contracts/=../third_party/openzeppelin-contracts/contracts/"]
solc = "solc"
auto_detect_solc = false
offline = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 1024
